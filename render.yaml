services:
  # 1. FastAPI Executive Web Dashboard (Recommended)
  - type: web
    name: enterprise-auditor-api
    runtime: python
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd .. && mkdir -p web && cp -r frontend/dist/* web/ && pip install -r requirements.txt
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Streamlit Dashboard Service
  - type: web
    name: enterprise-auditor-streamlit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
